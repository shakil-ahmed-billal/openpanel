name: Sync Upstream (Official OpenPanel)

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    name: Sync with upstream/main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Openpanel-dev/openpanel.git
          git fetch upstream main

      - name: Merge upstream changes
        run: |
          git merge upstream/main -m "chore: sync upstream Openpanel-dev/openpanel updates" --no-edit || {
            echo "Conflict detected during merge. Keeping production compose and deployment configs intact."
            git checkout --ours docker-compose.prod.yml docker/clickhouse/Dockerfile docker/redpanda/Dockerfile .github/workflows/sync-upstream.yml 2>/dev/null || true
            git add .
            git commit -m "chore: resolve merge conflicts and preserve production configs"
          }

      - name: Push updates to fork
        run: |
          git push origin main
